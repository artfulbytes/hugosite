<style>
.stepper { --ink: var(--primary, #ececec); --muted: var(--secondary, #9a9a9a); --rule: var(--border, #3a3a3d); --silk: #f2f2f2; --red: #ff4a3d; --accent: #ffb000; }
.stepper .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.stepper .current { margin: 0 0 12px; color: var(--muted); font-size: 0.95rem; }
.stepper .current b { color: var(--accent); }
.stepper .boards { display: flex; align-items: flex-start; }
.stepper .boards svg { display: block; height: auto; min-width: 0; }
.stepper #core { flex: 600 1 0; }
.stepper #gpio { flex: 850 1 0; margin-top: 2.76%; }
@media (max-width: 700px) {
.stepper .boards { flex-direction: column; }
.stepper #core, .stepper #gpio { flex: none; width: 100%; margin-top: 0; }
}
.stepper .pcb { fill: #0e5a2c; stroke: #0a3f1f; stroke-width: 2; }
.stepper .box { fill: none; stroke: var(--silk); stroke-width: 1.6; }
.stepper .title { fill: var(--silk); font: 800 14px "Arial Narrow", "Roboto Condensed", system-ui, sans-serif; }
.stepper .big { fill: var(--silk); font: 800 19px "Arial Narrow", "Roboto Condensed", system-ui, sans-serif; }
.stepper .lbl { fill: var(--silk); font: 700 10.5px system-ui, sans-serif; }
.stepper .sub { fill: var(--silk); font: 700 10px ui-monospace, Menlo, Consolas, monospace; opacity: 0.85; }
.stepper .w { fill: none; stroke: #e6e6e6; stroke-width: 1.2; stroke-linejoin: round; }
.stepper .g { fill: none; stroke: var(--silk); stroke-width: 1.4; stroke-linejoin: round; }
.stepper .dot { fill: var(--silk); }
.stepper .chip { fill: #1c1c1e; }
.stepper .leg { fill: #b5b5b5; }
.stepper .chiptxt { fill: #8c8c8c; font: 700 9px system-ui, sans-serif; }
.stepper .header { fill: #121212; }
.stepper .hpin { fill: #c9a640; }
.stepper .standoff { fill: #e8e8e2; }
.stepper .usb { fill: #9c9c9c; }
.stepper .hint { fill: var(--accent); font: 700 10.5px system-ui, sans-serif; }
.stepper .pinmetal { fill: #c4c4c4; }
.stepper .press { cursor: pointer; }
.stepper .press .switch { fill: #202022; stroke: #555; }
.stepper .press .cap { fill: #2e2e30; stroke: var(--accent); stroke-width: 2.5; }
.stepper .press:hover .cap { fill: #4a4a4e; }
.stepper .dim { opacity: 0.3; }
.stepper .bigled { fill: #2f4a35; stroke: #8aa58f; stroke-width: 1; }
.stepper .bigled.on { fill: #33ff6e; stroke: #c8ffd8; filter: url(#glow); }
.stepper #jbtn.disabled { cursor: default; }
.stepper #jbtn.disabled .cap { stroke: #666; }
.stepper #jbtn.disabled:hover .cap { fill: #2e2e30; }
.stepper #jbtn.disabled .hint { display: none; }
.stepper #jbtn.held .cap { fill: var(--red); }
.stepper .led rect { fill: #d9d8cf; stroke: #8b8b80; stroke-width: 0.6; }
.stepper .led .q { display: none; fill: #eee; font: 800 7px system-ui, sans-serif; }
.stepper .led.unknown rect { fill: #5a5a5a; stroke: #8a8a8a; }
.stepper .led.unknown .q { display: inline; }
.stepper .led.on rect { filter: url(#glow); }
.stepper .led.on.red rect { fill: #ff3b30; stroke: #ffc0b8; }
.stepper .led.on.yellow rect { fill: #ffc21a; stroke: #fff0b0; }
.stepper .led.on.green rect { fill: #33ff6e; stroke: #c8ffd8; }
.stepper .listing { border: 1px solid var(--rule); overflow-x: auto; max-width: 520px; margin-top: 24px; }
.stepper .listing h2 { font-size: 0.8rem; letter-spacing: 0.12em; margin: 0; padding: 10px 12px 6px; }
.stepper #prog { display: table; border-collapse: collapse; width: 100%; margin: 0; font-size: 0.8rem; }
.stepper #prog td { padding: 2px 6px; min-width: 0; line-height: 1.45; border: 0; white-space: nowrap; color: var(--muted); }
.stepper #prog td.c { color: #6f6f6f; }
.stepper #prog tr.label td { color: #7d7d7d; padding-top: 6px; }
.stepper #prog tr.cur td { background: rgba(255, 176, 0, 0.16); color: var(--ink); }
.stepper #prog tr.cur td.code { color: var(--accent); font-weight: 700; }
.stepper #prog td.clk { text-align: right; }
.stepper .ram { padding: 8px 12px 10px; color: var(--muted); font-size: 0.85rem; border-top: 1px solid var(--rule); }
.stepper .ram b { color: var(--ink); }
</style>
<div class="stepper">
<!-- COMPONENT -->
  <div class="current mono" id="current"></div>
  <div class="boards">
    <svg id="core" viewBox="0 0 600 560" role="img" aria-label="The 6502 core board"></svg>
    <svg id="gpio" viewBox="0 0 850 350" role="img" aria-label="The GPIO peripheral board"></svg>
  </div>
  <div class="listing">
    <h2>PROGRAM</h2>
    <table id="prog"></table>
    <div class="ram" id="ram"></div>
  </div>
  </div>

const text = (x, y, s, cls = 'lbl', anchor = 'start') =>
  `<text class="${cls}" x="${x}" y="${y}" text-anchor="${anchor}">${s}</text>`;

  `<rect class="box" x="${x}" y="${y}" width="${w}" height="${h}"/>` + text(x, y - 4, title, 'title')

function chip(x, y, w, h, n, upright, label = '') {
  let s = '';
  for (let i = 0; i < n; i++) {
    if (upright) {
      const py = y + (i + 0.5) * h / n - 1.5;
      s += `<rect class="leg" x="${x - 4}" y="${py}" width="4" height="3"/><rect class="leg" x="${x + w}" y="${py}" width="4" height="3"/>`;
    } else {
      const px = x + (i + 0.5) * w / n - 1.5;
      s += `<rect class="leg" x="${px}" y="${y - 4}" width="3" height="4"/><rect class="leg" x="${px}" y="${y + h}" width="3" height="4"/>`;
    }
  }
  s += `<rect class="chip" x="${x}" y="${y}" width="${w}" height="${h}"/>`;
  s += `<circle fill="#333" cx="${x + 6}" cy="${y + 6}" r="2"/>`;

    const cx = x + w / 2, cy = y + h / 2;
    s += `<text class="chiptxt" x="${cx}" y="${cy + 3}" text-anchor="middle" transform="rotate(-90 ${cx} ${cy})">${label}</text>`;
  } else if (label) {
    s += text(x + w / 2, y + h / 2 + 3, label, 'chiptxt', 'middle');
  }
  return s;
}

  });
  s += or2(110, 24) + bubble(133, 32) + and2(160, 28) + or2(110, 76) + not(140, 77) + and2(160, 128);
  s += wire(44.5, 28, 112, 28) + wire(44.5, 88, 112, 88) + dot(70, 88) + wire(70, 88, 70, 36, 112, 36);
  s += wire(44.5, 58, 150, 58, 150, 40, 160, 40) + dot(95, 58) + wire(95, 58, 95, 80, 112, 80);
  s += wire(136, 32, 160, 32) + wire(130, 84, 140, 84) + wire(70, 88, 70, 132, 160, 132);
  s += wire(44.5, 150, 140, 150, 140, 140, 160, 140);
  s += wire(178, 36, 184.5, 36) + wire(160, 84, 184.5, 84) + wire(178, 136, 184.5, 136);
  [['IO', 36], ['RAM', 84], ['ROM', 136]].forEach(([k, y]) => {
    s += led(190, y, k, 'red') + text(199, y + 3.5, k);
  });
  s += '</g>';

  s += box(25, 268, 130, 247, 'CPU') + chip(62, 282, 56, 220, 20, true, 'W65C02S');
  s += box(415, 140, 115, 100, 'RAM', '$0000–$3FFF') + chip(437, 180, 72, 42, 14, false);
  s += box(415, 262, 115, 253, 'ROM', '$8000–$FFFF') + chip(448, 292, 50, 205, 14, true);

  s += box(540, 40, 26, 360, 'IO');
  s += `<text class="sub" x="553" y="220" text-anchor="middle" transform="rotate(-90 553 220)">$4000–$5FFF</text>`;
  s += `<rect class="header" x="572" y="70" width="28" height="300"/>`;
  for (let i = 0; i < 24; i++) {
    s += `<rect class="hpin" x="578" y="${76 + i * 12.2}" width="5" height="5"/><rect class="hpin" x="589" y="${76 + i * 12.2}" width="5" height="5"/>`;
  }
  return s;
}

function gpioBoard() {
  let s = `<rect class="pcb" x="1" y="1" width="749" height="348"/>`;
  s += standoff(730, 20) + standoff(730, 330);
  s += `<rect class="header" x="1" y="30" width="13" height="290"/>`;

  s += text(28, 32, 'IO', 'lbl', 'middle') + led(28, 40, 'pio', 'red');
  s += text(28, 142, 'A0', 'lbl', 'middle') + led(28, 150, 'a0', 'yellow');
  s += text(28, 167, 'A1', 'lbl', 'middle') + led(28, 175, 'a1', 'yellow');

  // $4000 = IO and not a0 and not a1; $4001 = IO and a0 and not a1
  s += box(62, 28, 150, 300, 'DECODER') + '<g transform="translate(62 28)">';
  s += wire(-27.5, 12, 85, 12, 85, 216, 100, 216) + dot(85, 46) + wire(85, 46, 100, 46);
  s += wire(-27.5, 122, 30, 122) + not(30, 115) + wire(50, 122, 70, 122, 70, 52, 100, 52);
  s += dot(15, 122) + wire(15, 122, 15, 192, 92, 192, 92, 222, 100, 222);
  s += wire(-27.5, 147, 30, 147) + not(30, 140) + wire(50, 147, 78, 147, 78, 58, 100, 58);
  s += dot(78, 147) + wire(78, 147, 78, 228, 100, 228);
  s += and3(100, 40) + and3(100, 210) + wire(124, 52, 135.5, 52) + wire(124, 222, 135.5, 222);
  s += led(141, 52, 'sel4000', 'red') + led(141, 222, 'sel4001', 'red');
  s += chip(106, 100, 24, 60, 7, true) + chip(20, 262, 44, 22, 7, false);
  s += '</g>';
  s += wire(208.5, 80, 277, 80) + wire(208.5, 250, 277, 250);

  s += box(225, 28, 190, 150, 'CONFIG REGISTER', '$4000') + chip(277, 52, 86, 38, 10, false);
  ['bit7', 'bit6', 'IEN', 'PD', 'PU', 'OD', 'DIR', 'OUT'].forEach((n, i) => {
    const cx = 236 + i * 24;
    s += text(cx, 146, n.startsWith('bit') ? '–' : n, 'lbl', 'middle') + led(cx, 156, 'cfg.' + n, 'green');
  });
  s += box(225, 195, 190, 135, 'STATUS REGISTER', '$4001') + chip(277, 220, 86, 38, 10, false);
  [null, null, null, null, null, null, 'IRQ', 'IN'].forEach((n, i) => {
    const cx = 236 + i * 24;
    s += text(cx, 303, n || '–', 'lbl', 'middle') + led(cx, 313, n && 'st.' + n, 'green');
  });

  s += '<g transform="translate(30 0)">';    // everything right of the registers
  s += box(395, 28, 118, 150, 'PIN CONTROL') + chip(412, 48, 60, 28, 7, false);
  s += wire(333, 64, 402, 64, 402, 104, 408, 104) + not(408, 97);
  s += wire(428, 104, 450, 104) + and2(450, 100) + wire(442, 80, 442, 112, 450, 112);
  s += dot(442, 112) + wire(442, 112, 442, 139, 452, 139) + wire(402, 104, 402, 143, 408, 143) + not(408, 136);
  s += wire(428, 143, 452, 147) + or2(450, 135);
  s += wire(468, 108, 500, 108, 500, 70, 550.5, 70) + wire(470, 143, 506, 143, 506, 124, 550.5, 124);

  s += box(525, 28, 62, 150, 'OUTPUT');
  s += text(556, 60, 'HIGH', 'lbl', 'middle') + led(556, 70, 'HIGH', 'red');
  s += text(556, 114, 'LOW', 'lbl', 'middle') + led(556, 124, 'LOW', 'red');
  s += wire(561.5, 70, 574, 70, 574, 124, 561.5, 124) + dot(574, 97) + wire(574, 97, 592, 97, 592, 192, 719, 192);

  s += text(700, 54, 'GPIO', 'big', 'end') + text(700, 78, 'PERIPHERAL', 'big', 'end');

  s += box(598, 105, 62, 175, 'PULLS');
  s += text(621, 121, 'UP', 'lbl', 'middle') + led(621, 130, 'PULLUP', 'red');
  s += text(621, 272, 'DOWN', 'lbl', 'middle') + led(621, 258, 'PULLDOWN', 'red');
  s += wire(636, 118, 650, 118) + wire(643, 118, 643, 136) + `<rect class="g" x="639" y="136" width="8" height="20"/>`;
  s += wire(643, 156, 643, 192) + dot(643, 192) + wire(643, 192, 643, 212);
  s += `<rect class="g" x="639" y="212" width="8" height="20"/>` + wire(643, 232, 643, 262) + wire(636, 262, 650, 262);

  s += box(668, 105, 44, 175, 'CLAMPS');
  s += wire(690, 118, 690, 266) + dot(690, 192);
  s += `<path class="g" d="M683 160h14l-7-11z M683 148h14 M683 240h14l-7-11z M683 228h14"/>`;

  s += `<rect class="pinmetal" x="719" y="189" width="40" height="6"/>`;
  // Off the board: an LED to show the pin as an output, a button to drive it as an input.
  // Whichever one the program isn't using is dimmed.
  s += wire(759, 192, 796, 192) + dot(796, 192);
  s += '<g id="btnpart">' + wire(796, 192, 796, 160) + wire(796, 130, 796, 108) + wire(788, 108, 804, 108)
    + text(796, 99, '5 V', 'lbl', 'middle') + text(776, 149, 'BUTTON', 'lbl', 'end');
  s += `<g class="press" id="jbtn"><rect class="switch" x="781" y="130" width="30" height="30"/>`
    + `<circle class="cap" cx="796" cy="145" r="10"/>`
    + text(776, 163, 'click to', 'hint', 'end') + `<text class="hint" id="jhint" x="776" y="175" text-anchor="end">hold</text></g></g>`;
  s += '<g id="ledpart">' + wire(796, 192, 796, 223) + `<circle class="bigled" id="pinled" cx="796" cy="232" r="9"/>`
    + wire(796, 241, 796, 262) + wire(788, 262, 804, 262) + wire(791, 266, 801, 266) + wire(794, 270, 798, 270)
    + text(780, 236, 'LED', 'lbl', 'end') + '</g>';

  s += box(395, 195, 190, 78, 'INPUT') + text(436, 214, 'Synchronizer', 'lbl', 'middle') + text(530, 214, 'Schmitt', 'lbl', 'middle');
  s += `<rect class="g" x="410" y="222" width="28" height="30"/><rect class="g" x="450" y="222" width="28" height="30"/>`;
  s += wire(592, 192, 592, 237, 540, 237) + `<path class="g" d="M540 225L514 237L540 249z"/>`;
  s += wire(514, 237, 505.5, 237) + led(500, 237, 'schmitt', 'green') + wire(494.5, 237, 478, 237);
  s += wire(450, 237, 438, 237) + wire(410, 237, 333, 237);

  s += box(395, 297, 190, 35, 'INTERRUPT') + chip(412, 305, 44, 18, 7, false) + chip(470, 305, 44, 18, 7, false);
  s += '</g>';
  return s;
}

el('core').innerHTML = coreBoard();
el('gpio').innerHTML = gpioBoard();
const leds = [...document.querySelectorAll('[data-key]')].map(g => [g, g.dataset.key]);

const prog = el('prog');
const rows = program.map(r => {
  const tr = document.createElement('tr');
  if (r.clocks === null) {
    tr.className = 'label';
    tr.innerHTML = `<td class="mono" colspan="4"></td>`;
    tr.firstChild.textContent = r.code;
  } else {
    tr.innerHTML = '<td class="mono"></td><td class="mono c"></td><td class="mono code"></td><td class="mono clk"></td>';
    tr.children[0].textContent = r.where;
    tr.children[1].textContent = r.bytes;
    tr.children[2].textContent = r.code;
    if (r.addr === 'vector') {         // a long line with no bytes: let it take the bytes column too
      tr.children[1].remove();
      tr.children[1].colSpan = 2;
    }
  }
  prog.append(tr);
  return tr;
});

let path = [0];        // frames visited, so Back retraces the button presses too
let held = false;

function show() {
  const f = frames[path[path.length - 1]];
  for (const [g, key] of leds) {
    const v = f.leds[key];
    g.classList.toggle('on', v === true);
    g.classList.toggle('unknown', v === null);
  }
  // the running line, above the boards, so stepping needs no scrolling down to the listing
  const line = program.find(r => r.addr !== null && r.addr === f.inst);
  el('current').innerHTML = '<span></span>  <b></b>  · clock <span></span> of <span></span>';
  const [where, code, n, of] = el('current').children;
  where.textContent = line.where;
  code.textContent = line.code;
  n.textContent = f.n;
  of.textContent = line.clocks;
  rows.forEach((tr, i) => {
    const r = program[i];
    const cur = r.addr !== null && r.addr === f.inst;
    tr.classList.toggle('cur', cur);
    if (r.clocks !== null) {
      tr.lastChild.textContent = cur ? `${f.n} of ${r.clocks}` : '';
    }
  });
  el('ram').innerHTML = `RAM <span class="mono">$0200</span> holds <b class="mono"></b>`;
  el('ram').querySelector('b').textContent = f.ram;
  const canPress = next[path[path.length - 1]][1] !== null;
  if (!canPress) {
    held = false;
  }
  el('jbtn').classList.toggle('disabled', !canPress);
  el('btnpart').classList.toggle('dim', !canPress);
  el('ledpart').classList.toggle('dim', canPress);
  el('pinled').classList.toggle('on', f.leds.HIGH === true);
  el('jbtn').classList.toggle('held', held);
  el('jhint').textContent = held ? 'release' : 'hold';
}

function step() {
  const n = next[path[path.length - 1]][held ? 1 : 0];
  path.push(n);
  show();
}

function back() {
  if (path.length > 1) {
    path.pop();
    held = frames[path[path.length - 1]].button === true;
    show();
  }
}

function toggle() {
  if (next[path[path.length - 1]][1] !== null) {
    held = !held;
    show();
  }
}

function restart() {
  path = [0];
  held = false;
  show();
}

el('clockbtn').onclick = step;
el('resetbtn').onclick = restart;
el('jbtn').onclick = toggle;
show();
}
</script>
